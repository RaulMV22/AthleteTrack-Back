# Application
spring.application.name=athletetrack-backend
server.port=8080

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=337953436078-5et3cpour6ks9vgdhd2q4igrr5bvn1hv.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=PLACEHOLDER_REPLACE_ME
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# H2 Database
# Database file will be created at: ./data/athletetrack.mv.db
# For production, consider using a production-ready database like PostgreSQL or MySQL
spring.datasource.url=jdbc:h2:file:./data/athletetrack
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
# WARNING: CHANGE THIS SECRET IN PRODUCTION!
# The secret should be a long, cryptographically secure random string (at least 256 bits for HS256)
# You can generate one using: openssl rand -base64 64
jwt.secret=your-secret-key-change-in-production-make-it-very-long-and-secure
jwt.expiration=86400000

# Logging
logging.level.com.athletetrack=DEBUG
logging.level.org.springframework.security=DEBUG

# Max request size for file uploads (base64 images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
